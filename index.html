<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE OUTSIDE MIND</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #000;
    }
    .widget {
      position: relative; width: 100%; height: 100%;
      cursor: pointer; display: block; text-decoration: none;
    }
    video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; object-fit: cover; pointer-events: none;
    }
    .title {
      position: absolute;
      top: 38%;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Caveat', cursive;
      font-size: clamp(2.2rem, 10vw, 3.4rem);
      font-weight: 700;
      color: #ff2222;
      text-shadow: 
        0 0 6px #ff0000,
        0 0 14px #ff0000,
        0 0 22px #ff2222;
      z-index: 2;
      line-height: 1.1;
      pointer-events: none;
      transform: rotate(-2deg);
      letter-spacing: 1px;
    }
    .btn {
      position: absolute;
      top: 56%;
      left: 50%;
      transform: translateX(-50%);
      background: #00e8ff;
      color: #111;
      font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
      font-size: clamp(0.9rem, 4.5vw, 1.1rem);
      font-weight: 900;
      padding: 0.5em 1.5em;
      border-radius: 7px;
      box-shadow: 0 0 12px #00e8ff, 0 0 24px rgba(0,232,255,0.5);
      white-space: nowrap;
      z-index: 2;
      letter-spacing: 0.5px;
      pointer-events: none;
      transition: all 0.2s ease;
    }
    .widget:hover .btn {
      background: #ffffff;
      box-shadow: 0 0 16px #00e8ff, 0 0 32px rgba(0,232,255,0.7);
    }
  </style>
</head>
<body>
  <a class="widget" href="https://danceknightprime.blogspot.com/p/the-outside-mind.html" target="_blank" rel="noopener">
    <video autoplay muted loop playsinline>
      <source src="https://raw.githubusercontent.com/danceknightxd/outsidemind/main/theoutside_clean.mp4" type="video/mp4">
    </video>
    <div class="title">THE OUTSIDE MIND</div>
    <div class="btn">CLICK HERE</div>
  </a>
</body>
</html>
